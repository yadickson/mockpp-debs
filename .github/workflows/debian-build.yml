name: Build Debian Package

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        suite: [stable]
        architecture: [i386, amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - name: checkout source code
        uses: actions/checkout@v4
      - name: Build Debian package for ${{ matrix.suite }} on ${{ matrix.architecture }}
        uses: jtdor/build-deb-action@v1
        env:
          DEB_BUILD_OPTIONS: noautodbgsym
        with:
          docker-image: debian:${{ matrix.suite }}-slim
          host-arch: ${{ matrix.architecture }}
          buildpackage-opts: -rfakeroot -D -us -uc -i -I -sa --build=binary --no-sign
          before-build-hook: debchange --controlmaint --local="+ci${{ github.run_id }}~${{ matrix.suite }}~git$(git rev-parse --short HEAD)" "CI build"
          extra-build-deps: devscripts git
