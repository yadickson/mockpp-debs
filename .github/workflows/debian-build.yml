name: Build Debian Package

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
#        codename: [buster, bullseye, bookworm, trixie, forky]
        codename: [stretch]
        architecture: [amd64]
    runs-on: ubuntu-latest
    steps:
      - name: checkout source code
        uses: actions/checkout@v6
      - name: Check Dockerfile
        id: file_check
        run: |
          if [ -f .github/container/Dockerfile.${{ matrix.codename }} ]; then
            echo "docker_image=.github/container/Dockerfile.${{ matrix.codename }}" >> $GITHUB_OUTPUT
          else
            echo "docker_image=debian:${{ matrix.codename }}-slim" >> $GITHUB_OUTPUT
          fi
      - name: Build Debian binary and source package for ${{ matrix.codename }} on ${{ matrix.architecture }}
        uses: jtdor/build-deb-action@v1
        env:
          DEB_BUILD_OPTIONS: noautodbgsym
        with:
          docker-image: ${{ steps.file_check.outputs.docker_image }}
          apt-opts: --no-install-recommends --no-install-suggests
          host-arch: ${{ matrix.architecture }}
          artifacts-dir: ./artifacts
          source-dir: ./
          buildpackage-opts: -rfakeroot -D -us -ui -uc -i -I -sa -j1
          before-build-hook: |
            debian/rules get-orig-source
            debian/rules publish-source
            debchange --controlmaint --local="+ci${{ github.run_id }}~${{ matrix.codename }}~git$(git rev-parse --short HEAD)" "CI build on ${{ matrix.codename }}"
          extra-build-deps: devscripts git unzip wget
      - name: List artifacts files
        run: |
          ls -ls ./artifacts