name: Build Debian Package

on: [push, pull_request]

jobs:
  lenny:
    strategy:
      matrix:
        codename: [lenny]
    runs-on: ubuntu-latest
    steps:
      - name: checkout source code
        uses: actions/checkout@v6
      - name: Build Debian binary and source package for ${{ matrix.codename }}
        uses: yadickson/build-deb-action@v2
        env:
          DEB_BUILD_OPTIONS: noautodbgsym
        with:
          docker-image: debian/eol:${{ matrix.codename }}
          artifacts-dir: ./artifacts
          source-dir: ./
          before-build-hook: |
            debian/rules get-orig-source
            debian/rules publish-source
          extra-build-deps: git unzip wget
      - name: List artifacts files
        run: |
          ls -ls ./artifacts
  squeeze:
    strategy:
      matrix:
        codename: [squeeze]
    runs-on: ubuntu-latest
    steps:
      - name: checkout source code
